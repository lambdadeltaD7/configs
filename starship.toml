# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = '''
$cmd_duration
$git_status $git_branch
$directory
$username[@arch](bold) $character'''


[cmd_duration]
min_time = 500
show_milliseconds = true
format = 'executed in: [$duration](bold yellow)'

[directory]
truncation_length = 7
truncate_to_repo = false
truncation_symbol = '../'
# This removes the folder icon that Starship displays by default
format = '[$path](bold)'

[username]
show_always = true
format ='[$user](bold)'

# Inserts a blank line between shell prompts
#add_newline = true

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[❯](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

	
[git_status]
format = """\
[\\[](bold cyan)$conflicted$staged\
$untracked$modified\
$deleted$renamed\
$ahead_behind$up_to_date [\\]](bold cyan) \
"""
conflicted = '[ ](bold red)'
up_to_date = '[ ✔](bold green)'
untracked = '[ ?${count}](bold #FF870F)'
modified = '[ M($count)](bold yellow)'
staged = '[ ✚\($count\)](bold green)'
renamed = '[ ->${count}](bold blue)'
deleted = '[ 🗑 ${count}](bold red)'
ahead = '[ ▲${count}](bold purple)'
diverged = '[ \(⇅ ▲${ahead_count} ▼${behind_count}\)](bold purple)'
behind = '[ ▼${count}](bold purple)'


[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

